<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 Media Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📦 S3 Media Manager</h1>
                <div class="header-info" id="headerInfo"></div>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls">
            <button id="refreshBtn" class="btn btn-primary">🔄 Refresh</button>
            <button id="selectAllBtn" class="btn btn-secondary">☑️ Select All</button>
            <button id="deselectAllBtn" class="btn btn-secondary">☐ Deselect All</button>
            <button id="deleteSelectedBtn" class="btn btn-danger" disabled>🗑️ Delete Selected</button>
            <button id="deleteClearBtn" class="btn btn-warning" disabled>⚠️ Delete All</button>
        </div>

        <!-- Statistics -->
        <div class="stats" id="stats"></div>

        <!-- Search & Filter -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search by name...">
            <select id="filterType">
                <option value="">All Media</option>
                <option value="image">Images Only</option>
                <option value="video">Videos Only</option>
            </select>
        </div>

        <!-- Media Grid -->
        <div class="media-grid" id="mediaGrid">
            <div class="loading">Loading media...</div>
        </div>

        <!-- No results -->
        <div id="noResults" class="no-results" style="display: none;">
            <p>No media files found</p>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="confirmModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="confirmTitle">Confirm Deletion</h2>
            <p id="confirmMessage"></p>
            <div class="modal-buttons">
                <button id="confirmOkBtn" class="btn btn-danger">Delete</button>
                <button id="confirmCancelBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Success/Error Notifications -->
    <div id="notification" class="notification" style="display: none;"></div>

    <script src="/app.js"></script>
</body>
</html>
